# Print Monitor Nginx Reverse Proxy Konfiguratsiyasi
# Joylashuv: /etc/nginx/sites-available/print_monitor

server {
    listen 80;
    server_name your_domain_or_ip; # O'zingizning server IP yoki domeningizni yozing

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer sozlamalari (kattaroq hisobotlar yuklanganda uzilishlar bo'lmasligi uchun)
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # API ulanishlari uchun maxsus sozlamalar (timeoutlarni uzaytirish)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
