version: '3.8'

services:
  print-monitor:
    build: .
    image: canon-print-monitor:latest
    container_name: canon_print_monitor
    restart: unless-stopped
    ports:
      - "5000:5000/tcp"
      - "5140:5140/udp"
    volumes:
      - ./canon_logs.db:/app/canon_logs.db
      - ./toner_cache.json:/app/toner_cache.json
    environment:
      - TZ=Asia/Tashkent
      - WEB_PORT=5000
      - SYSLOG_PORT=5140
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
